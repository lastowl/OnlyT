<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>OnlyT Timer Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            color: #969696;
            background-color: #2D2D2D;
            margin: 0;
            padding: 10px;
        }

        .sdpi-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sdpi-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sdpi-item-label {
            color: #969696;
            font-size: 11px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        select {
            background-color: #3D3D3D;
            border: 1px solid #4A4A4A;
            border-radius: 3px;
            color: #D8D8D8;
            padding: 6px 8px;
            font-size: 12px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: #0078D7;
            outline: none;
        }

        button {
            background-color: #0078D7;
            border: none;
            border-radius: 3px;
            color: white;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background-color: #1084D9;
        }

        button:active {
            background-color: #006CC1;
        }

        .divider {
            border-top: 1px solid #4A4A4A;
            margin: 12px 0;
        }

        .info-text {
            color: #666;
            font-size: 10px;
            font-style: italic;
        }

        #talkSelect {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <div class="sdpi-item-label">OnlyT Host</div>
            <input type="text" id="host" placeholder="localhost" value="localhost">
        </div>

        <div class="sdpi-item">
            <div class="sdpi-item-label">Port</div>
            <input type="number" id="port" placeholder="8096" value="8096" min="1" max="65535">
        </div>

        <div class="divider"></div>

        <div class="sdpi-item" id="talkSelectContainer">
            <div class="sdpi-item-label">Select Talk (optional)</div>
            <select id="talkSelect">
                <option value="">-- Auto (next available) --</option>
            </select>
            <div class="info-text">Leave as "Auto" to start the next available talk</div>
        </div>

        <button id="refreshTalks">Refresh Talk List</button>
    </div>

    <script>
        // Stream Deck Property Inspector connection
        let websocket = null;
        let uuid = null;
        let actionInfo = null;

        // Called by Stream Deck when PI is loaded
        function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inPropertyInspectorUUID;
            actionInfo = JSON.parse(inActionInfo);

            websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);

            websocket.onopen = () => {
                websocket.send(JSON.stringify({
                    event: inRegisterEvent,
                    uuid: inPropertyInspectorUUID
                }));

                // Load saved settings
                loadSettings();
            };

            websocket.onmessage = (evt) => {
                const data = JSON.parse(evt.data);
                if (data.event === 'didReceiveSettings') {
                    const settings = data.payload.settings || {};
                    applySettings(settings);
                }
            };
        }

        // Load settings from Stream Deck
        function loadSettings() {
            const settings = actionInfo.payload.settings || {};
            applySettings(settings);
        }

        // Apply settings to UI
        function applySettings(settings) {
            document.getElementById('host').value = settings.host || 'localhost';
            document.getElementById('port').value = settings.port || 8096;

            if (settings.talkId) {
                const select = document.getElementById('talkSelect');
                // Check if option exists, if not add it
                let found = false;
                for (let opt of select.options) {
                    if (opt.value === String(settings.talkId)) {
                        opt.selected = true;
                        found = true;
                        break;
                    }
                }
                if (!found && settings.talkId) {
                    const opt = document.createElement('option');
                    opt.value = settings.talkId;
                    opt.text = `Talk ${settings.talkId}`;
                    opt.selected = true;
                    select.appendChild(opt);
                }
            }

            // Refresh talks list
            refreshTalkList();
        }

        // Save settings to Stream Deck
        function saveSettings() {
            const settings = {
                host: document.getElementById('host').value || 'localhost',
                port: parseInt(document.getElementById('port').value) || 8096,
                talkId: document.getElementById('talkSelect').value || null
            };

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({
                    event: 'setSettings',
                    context: uuid,
                    payload: settings
                }));
            }
        }

        // Refresh talk list from OnlyT API
        async function refreshTalkList() {
            const host = document.getElementById('host').value || 'localhost';
            const port = document.getElementById('port').value || 8096;
            const baseUrl = `http://${host}:${port}`;

            try {
                const response = await fetch(`${baseUrl}/api/v1/timers/`);
                const data = await response.json();

                const select = document.getElementById('talkSelect');
                const currentValue = select.value;

                // Clear existing options (except first)
                while (select.options.length > 1) {
                    select.remove(1);
                }

                // Add talks from API
                if (data.timerInfo && Array.isArray(data.timerInfo)) {
                    data.timerInfo.forEach(talk => {
                        const opt = document.createElement('option');
                        opt.value = talk.talkId;
                        opt.text = talk.talkTitle || `Talk ${talk.talkId}`;
                        if (String(talk.talkId) === currentValue) {
                            opt.selected = true;
                        }
                        select.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error('Failed to refresh talk list:', error);
            }
        }

        // Event listeners
        document.getElementById('host').addEventListener('change', saveSettings);
        document.getElementById('port').addEventListener('change', saveSettings);
        document.getElementById('talkSelect').addEventListener('change', saveSettings);
        document.getElementById('refreshTalks').addEventListener('click', refreshTalkList);
    </script>
</body>
</html>
