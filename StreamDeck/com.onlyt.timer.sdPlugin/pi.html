<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>OnlyT Timer Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            color: #969696;
            background-color: #2D2D2D;
            margin: 0;
            padding: 10px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            color: #D8D8D8;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-label {
            font-size: 11px;
        }

        input, select {
            background-color: #3D3D3D;
            border: 1px solid #4A4A4A;
            border-radius: 3px;
            color: #D8D8D8;
            padding: 6px 8px;
            font-size: 12px;
            max-width: 100%;
        }

        input:focus, select:focus {
            border-color: #0078D7;
            outline: none;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            background-color: #0078D7;
            border: none;
            border-radius: 3px;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover { background-color: #1084D9; }
        button:active { background-color: #006CC1; }
        button:disabled { background-color: #4A4A4A; cursor: default; }

        .divider {
            border-top: 1px solid #4A4A4A;
            margin: 12px 0;
        }

        .info-text {
            color: #7A7A7A;
            font-size: 10px;
        }

        .status { font-size: 11px; }
        .status.ok { color: #4CAF50; }
        .status.error { color: #F44336; }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="section">
        <div class="section-title">OnlyT connection</div>
        <div class="info-text">Used by every OnlyT key. Match OnlyT's settings under Remote apps, and turn its API on.</div>

        <div class="item">
            <label class="item-label" for="host">Host</label>
            <input type="text" id="host" placeholder="localhost" spellcheck="false">
        </div>

        <div class="item">
            <label class="item-label" for="port">Port</label>
            <input type="number" id="port" placeholder="8096" min="1" max="65535">
        </div>

        <div class="item">
            <label class="item-label" for="accessCode">Access code (if set in OnlyT)</label>
            <input type="password" id="accessCode" autocomplete="off">
        </div>

        <div class="row">
            <button id="testConnection">Test connection</button>
            <span id="connectionStatus" class="status"></span>
        </div>
    </div>

    <div id="talkSection" hidden>
        <div class="divider"></div>
        <div class="section">
            <div class="section-title">Talk</div>
            <div class="item">
                <select id="talkSelect">
                    <option value="" id="autoOption">Automatic</option>
                </select>
                <div class="info-text" id="autoInfo"></div>
            </div>
            <div class="row">
                <button id="refreshTalks">Refresh talk list</button>
                <span id="talkStatus" class="status"></span>
            </div>
        </div>
    </div>

    <div id="actionInfoSection" hidden>
        <div class="divider"></div>
        <div class="info-text" id="actionInfo"></div>
    </div>

    <script>
        const AUTO_TALK_TEXT = {
            'com.onlyt.timer.start': ['Automatic (first talk not yet timed)', 'Starts the first talk in OnlyT\'s schedule that hasn\'t been timed yet.'],
            'com.onlyt.timer.stop': ['Automatic (whichever talk is running)', 'Stops the running timer. Choose a talk to only stop that one.'],
            'com.onlyt.timer.toggle': ['Automatic (first talk not yet timed)', 'Stops the running timer, or starts the chosen talk when none is running.'],
        };

        const ACTION_INFO = {
            'com.onlyt.timer.bell': 'Rings OnlyT\'s bell. The bell must be enabled in OnlyT\'s settings.',
            'com.onlyt.timer.next': 'Stops the running talk and starts the one after it. When nothing is running, starts the first talk not yet timed.',
        };

        let websocket = null;
        let uuid = null;
        let action = null;
        let actionSettings = {};

        const $ = id => document.getElementById(id);

        // Called by Stream Deck when the property inspector loads
        function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inPropertyInspectorUUID;
            const actionInfo = JSON.parse(inActionInfo);
            action = actionInfo.action;
            actionSettings = actionInfo.payload.settings || {};

            setUpForAction();

            websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);
            websocket.onopen = () => {
                send({ event: inRegisterEvent, uuid });
                send({ event: 'getGlobalSettings', context: uuid });
            };
            websocket.onmessage = evt => onMessage(JSON.parse(evt.data));
        }

        function send(message) {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify(message));
            }
        }

        function sendToPlugin(payload) {
            send({ event: 'sendToPlugin', action, context: uuid, payload });
        }

        function setUpForAction() {
            if (AUTO_TALK_TEXT[action]) {
                const [autoText, infoText] = AUTO_TALK_TEXT[action];
                $('autoOption').text = autoText;
                $('autoInfo').textContent = infoText;
                $('talkSection').hidden = false;
                if (actionSettings.talkId) {
                    addTalkOption(actionSettings.talkId, `Talk ${actionSettings.talkId}`);
                    $('talkSelect').value = String(actionSettings.talkId);
                }
            }

            if (ACTION_INFO[action]) {
                $('actionInfo').textContent = ACTION_INFO[action];
                $('actionInfoSection').hidden = false;
            }
        }

        function onMessage(message) {
            switch (message.event) {
                case 'didReceiveGlobalSettings': {
                    const settings = message.payload.settings || {};
                    $('host').value = settings.host || 'localhost';
                    $('port').value = settings.port || 8096;
                    $('accessCode').value = settings.accessCode || '';
                    testConnection();
                    break;
                }

                case 'sendToPropertyInspector':
                    onPluginResponse(message.payload || {});
                    break;
            }
        }

        function onPluginResponse(payload) {
            switch (payload.response) {
                case 'connection':
                    $('testConnection').disabled = false;
                    if (payload.ok) {
                        setStatus('connectionStatus', payload.version ? `Connected to OnlyT ${payload.version}` : 'Connected', true);
                        if (!$('talkSection').hidden) {
                            refreshTalks();
                        }
                    } else {
                        setStatus('connectionStatus', payload.message, false);
                    }
                    break;

                case 'talks':
                    $('refreshTalks').disabled = false;
                    if (payload.ok) {
                        fillTalks(payload.talks || []);
                        setStatus('talkStatus', '', true);
                    } else {
                        setStatus('talkStatus', 'Couldn\'t load talks', false);
                    }
                    break;
            }
        }

        function setStatus(id, text, ok) {
            const element = $(id);
            element.textContent = text || '';
            element.className = `status ${ok ? 'ok' : 'error'}`;
        }

        function addTalkOption(id, title) {
            const option = document.createElement('option');
            option.value = String(id);
            option.text = title;
            $('talkSelect').appendChild(option);
        }

        function fillTalks(talks) {
            const select = $('talkSelect');
            const selected = actionSettings.talkId ? String(actionSettings.talkId) : '';

            while (select.options.length > 1) {
                select.remove(1);
            }

            talks.forEach(talk => addTalkOption(talk.id, talk.title));

            if (selected && !talks.some(talk => String(talk.id) === selected)) {
                addTalkOption(selected, `Talk ${selected} (not in schedule)`);
            }

            select.value = selected;
        }

        function saveConnection() {
            const connection = {
                host: $('host').value.trim() || 'localhost',
                port: parseInt($('port').value, 10) || 8096,
                accessCode: $('accessCode').value.trim(),
            };

            send({ event: 'setGlobalSettings', context: uuid, payload: connection });
            sendToPlugin({ request: 'connectionChanged', connection });
            testConnection();
        }

        function testConnection() {
            $('testConnection').disabled = true;
            setStatus('connectionStatus', 'Connecting…', true);
            sendToPlugin({ request: 'testConnection' });
        }

        function refreshTalks() {
            $('refreshTalks').disabled = true;
            sendToPlugin({ request: 'getTalks' });
        }

        function saveTalk() {
            const value = $('talkSelect').value;
            actionSettings = { ...actionSettings, talkId: value ? parseInt(value, 10) : null };
            send({ event: 'setSettings', context: uuid, payload: actionSettings });
        }

        $('host').addEventListener('change', saveConnection);
        $('port').addEventListener('change', saveConnection);
        $('accessCode').addEventListener('change', saveConnection);
        $('testConnection').addEventListener('click', testConnection);
        $('refreshTalks').addEventListener('click', refreshTalks);
        $('talkSelect').addEventListener('change', saveTalk);
    </script>
</body>
</html>
